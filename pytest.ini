[pytest]
testpaths = tests
addopts = -ra
markers =
    ui: test interfejsu z użyciem Selenium WebDriver
    api: test na poziomie REST API
    nonfunctional: test niefunkcjonalny (ISO/IEC 25010)
    tc(id): identyfikator przypadku testowego, np. TC-F01
    feature(*ids): powiązane funkcje z analizy produktu, np. F01
