[pytest]
testpaths = tests
addopts = -ra
markers =
    ui: user interface test using Selenium WebDriver
    api: test at the REST API level
    nonfunctional: non-functional test (ISO/IEC 25010)
    tc(id): test case identifier, e.g. TC-F01
    feature(*ids): related features from the product analysis, e.g. F01
