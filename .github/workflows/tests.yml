name: Automated tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  functional:
    name: Functional (Selenium UI + API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Start Gitea (test object)
        run: bash scripts/bootstrap.sh
      - run: pip install -r requirements.txt
      - name: Functional tests
        run: >
          pytest -m "not nonfunctional"
          --junitxml=reports/junit-functional.xml
          --html=reports/functional.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-functional
          path: reports/

  nonfunctional:
    name: Non-functional (ISO/IEC 25010)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PERF_DURATION: 15s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Start Gitea (test object)
        run: bash scripts/bootstrap.sh
      - run: pip install -r requirements.txt
      - name: Non-functional tests
        run: >
          pytest -m nonfunctional -k "not edge"
          --junitxml=reports/junit-nonfunctional.xml
          --html=reports/nonfunctional.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-nonfunctional
          path: reports/
